name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olimp
          POSTGRES_PASSWORD: olimp-ci-only
          POSTGRES_DB: olimp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olimp -d olimp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://olimp:olimp-ci-only@127.0.0.1:5432/olimp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate
      - run: pnpm db:import
      - run: pnpm test:integration
      - run: docker build --target web --tag olimp-web:ci .
