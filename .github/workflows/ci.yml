name: Project checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olimp
          POSTGRES_PASSWORD: olimp-ci-only
          POSTGRES_DB: olimp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olimp -d olimp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://olimp:olimp-ci-only@127.0.0.1:5432/olimp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:migrate
      - run: pnpm db:import
      - run: pnpm test:integration

  # The hackathon requirement: the whole solution starts with one command and builds in under 5 minutes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDENT_LOGIN: student
      STUDENT_PASSWORD: ci-check-password
    steps:
      - uses: actions/checkout@v4
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|; s|^TEST_ACCOUNTS=.*|TEST_ACCOUNTS=$STUDENT_LOGIN:$STUDENT_PASSWORD|" .env
      - name: Pull base images (not counted in the build time)
        run: docker pull node:22-bookworm-slim && docker pull caddy:2-alpine && docker compose pull postgres
      - name: Build without cache in under 5 minutes
        run: |
          start=$(date +%s)
          docker compose build --no-cache
          took=$(( $(date +%s) - start ))
          echo "Сборка: ${took} с" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$took" -lt 300
      - name: Start with one command
        run: |
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && exit 0; sleep 3; done
          docker compose ps -a; docker compose logs --tail=80; exit 1
      - name: DATA-API checks
        run: docker compose run --rm --no-deps -e STUDENT_LOGIN -e STUDENT_PASSWORD api node scripts/check-data-api.mjs http://web/api
      - name: Stop and start again, data is kept
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/health && break; sleep 3; done
          docker compose run --rm --no-deps -e STUDENT_LOGIN -e STUDENT_PASSWORD api node scripts/check-data-api.mjs http://web/api
      - name: Logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200
