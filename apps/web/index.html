<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fb" />
    <script>
      // Saved theme before the first paint, so a dark launch never flashes light. lib/theme.ts takes over afterwards.
      (function () {
        var preference = null;
        try { preference = localStorage.getItem('olimp.theme.v1'); } catch (error) {}
        var dark = preference === 'dark' || (preference !== 'light' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b0f14' : '#f8f9fb');
      })();
    </script>
    <meta name="description" content="Olimp — каталог олимпиад и твой личный план участия." />
    <title>Каталог · Olimp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/startup.css" />
    <script src="https://st.max.ru/js/max-web-app.js" defer></script>
  </head>
  <body><div id="root"><main class="startup-screen" aria-busy="true"><div class="startup-screen__progress" role="progressbar" aria-label="Загрузка приложения"></div><p role="status">Загружаем…</p></main></div><script type="module" src="/src/main.tsx"></script></body>
</html>
