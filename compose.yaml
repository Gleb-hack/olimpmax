services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: olimp
      POSTGRES_USER: olimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - olimp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olimp -d olimp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  olimp-postgres:
