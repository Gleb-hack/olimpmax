# Local run of the whole solution with one command:  docker compose up -d --build
# Mini App: http://localhost:8080 · API: http://localhost:8080/api (health: /api/health)
# Settings come from .env (copy .env.example). Production with a domain and HTTPS: compose.production.yaml.
name: olimp

x-server: &server
  build:
    context: .
    target: api
  image: olimp-api:local

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: olimp
      POSTGRES_USER: olimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Only on this computer: for `pnpm dev` and integration tests.
      - "127.0.0.1:55432:5432"
    volumes:
      - olimp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olimp -d olimp"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Migrations, catalog and reference import, verified dates. Idempotent: saved plans are kept.
  setup:
    <<: *server
    command: ["pnpm", "db:setup"]
    environment:
      DATABASE_URL: postgresql://olimp:${POSTGRES_PASSWORD}@postgres:5432/olimp
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://olimp:${POSTGRES_PASSWORD}@postgres:5432/olimp
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      TRUST_PROXY_HOPS: "1"
      ALLOW_DEV_AUTH: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      TEST_ACCOUNTS: ${TEST_ACCOUNTS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Exits right away when MAX_BOT_TOKEN is empty. MAX gives each update to one polling client only:
  # do not run it with the token of a bot that is already running on the server.
  bot:
    build:
      context: .
      target: bot
    image: olimp-bot:local
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://olimp:${POSTGRES_PASSWORD}@postgres:5432/olimp
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      BOT_REMINDER_HOUR: ${BOT_REMINDER_HOUR:-16}
      BOT_REMINDER_UNTIL_HOUR: ${BOT_REMINDER_UNTIL_HOUR:-21}
      BOT_CHECK_MINUTES: ${BOT_CHECK_MINUTES:-15}
      BOT_REMIND_ESTIMATED: ${BOT_REMIND_ESTIMATED:-true}
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    image: olimp-web:local
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  olimp-postgres:
